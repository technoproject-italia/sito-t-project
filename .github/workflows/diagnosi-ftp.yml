name: Diagnosi FTP (temporaneo)
on: workflow_dispatch
jobs:
  elenca:
    runs-on: ubuntu-latest
    steps:
      - name: Elenca le cartelle visibili all'utente FTP
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "%2F" "%2Fdomains/t-project.io/public_html/" "%2Fdomains/t-project.io/public_html/fiera/"; do
            out=$(curl -sS --ssl-reqd -k --max-time 30 --list-only -u "$U:$P" "ftp://$H/$d" 2>&1 | tr '\r\n' '  ')
            echo "::notice::[/$d] $out"
          done
          echo "== PWD"
          pwd=$(curl -sS --ssl-reqd -k --max-time 30 --list-only -u "$U:$P" "ftp://$H/" -v 2>&1 | grep -E '^< 257' | tr -d '\r')
          echo "::notice::[PWD] $pwd"
